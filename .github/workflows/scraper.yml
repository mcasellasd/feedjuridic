name: Actualització Diària DretCat

on:
  # S'executa automàticament cada matí a les 07:00 UTC (08:00 / 09:00 hora catalana)
  schedule:
    - cron: '0 7 * * *'
  # Permet executar-ho manualment des d'un botó a la web de GitHub (a la pestanya "Actions")
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dretcat-actualitzar-dades
  cancel-in-progress: false

jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar el codi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Executar Scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scraper.py
        
      - name: Pujar els nous canvis a GitHub
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/

          # Comprova si hi ha hagut canvis. Si n'hi ha, fa el commit i els puja.
          if git diff --quiet && git diff --staged --quiet; then
            echo "No hi ha canvis per publicar"
            exit 0
          fi

          git commit -m "Automated update: novetats.json i estadistiques.json"

          # Retry loop: fins a 3 intents per si hi ha race condition
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=1
              echo "Push completat a l'intent $i"
              break
            fi
            echo "Intent $i fallat, reintentant..."
            sleep $((i * 5))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "No s'ha pogut publicar després de 3 intents"
            exit 1
          fi
