name: Actualització Diària DretCat

on:
  # S'executa automàticament cada matí a les 07:00 UTC (08:00 / 09:00 hora catalana)
  schedule:
    - cron: '0 7 * * *'
  # Permet executar-ho manualment des d'un botó a la web de GitHub (a la pestanya "Actions")
  workflow_dispatch:

jobs:
  actualitzar-dades:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar el codi
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Executar Scraper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scraper.py
        
      - name: Pujar els nous canvis a GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Comprova si hi ha hagut canvis. Si n'hi ha, fa el commit i els puja.
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated update: novetats.json i estadistiques.json"
          git push
